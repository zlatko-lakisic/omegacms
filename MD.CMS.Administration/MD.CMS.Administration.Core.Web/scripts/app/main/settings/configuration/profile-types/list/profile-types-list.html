<div id="file-manager" class="page-layout simple right-sidenav" layout="row">
    <!-- CENTER -->
    <div class="center" layout="column" flex>
        <!-- HEADER -->
        <div class="header md-accent-bg">
            <div class="header-content" layout="column" layout-align="space-between">
                <!-- TOOLBAR -->
                <md-content-header on-search="vm.search(searchTerm)" is-large="true">
                    <span class="md-display-1 font-weight-300" md-resource-text name="Titles.ProfileTypeList"></span>
                </md-content-header>
                <!-- / TOOLBAR -->
            </div>
            <!-- ADD FILE BUTTON -->
            <md-fab-speed-dial md-open="vm.menuOpened" md-direction="right" class="add-file-button md-scale">
                <md-fab-trigger>
                    <md-button aria-label="menu" class="md-fab md-warn">
                        <md-icon md-font-icon="icon-plus"></md-icon>
                    </md-button>
                </md-fab-trigger>
                <md-fab-actions>
                    <md-button class="md-fab md-raised md-mini" ui-sref="app.profile-types-form({currentView:'new'})">
                        <md-tooltip md-direction="bottom"><md-resource-text name="Labels.AddProfileType"></md-resource-text></md-tooltip>
                        <md-icon md-font-icon="icon-file"></md-icon>
                    </md-button>
                </md-fab-actions>
            </md-fab-speed-dial>
            <!-- / ADD FILE BUTTON -->
        </div>
        <!-- / HEADER -->
        <!-- CONTENT -->


        <md-content class="content" flex ms-scroll>
            <!-- PAGINATION -->
            <md-pager page="vm.currentPage" total="vm.totalItems" no-tabs="true" on-pager-change="vm.updatePager(currentPage, pageSize, pagesBorder)"></md-pager>
             <!-- / PAGINATION -->
            <div class="table-container">
                <div ng-include="'scripts/app/main/settings/configuration/profile-types/list/views/list/list-view.html'"></div>
            </div>
        </md-content>
        <!-- / CONTENT -->
    </div>
    <!-- / CENTER -->
    <!-- SIDENAV -->
    <md-sidenav class="sidenav details-sidenav md-sidenav-right" md-is-open="vm.selected !== undefined" md-is-locked-open="$mdMedia('gt-md') && vm.selected !== undefined"
                md-component-id="details-sidenav"
                ng-include="'scripts/app/main/settings/configuration/profile-types/list/sidenavs/details/details-sidenav.html'" ms-scroll
                ms-sidenav-helper>
    </md-sidenav>
    <!-- / SIDENAV -->
</div>

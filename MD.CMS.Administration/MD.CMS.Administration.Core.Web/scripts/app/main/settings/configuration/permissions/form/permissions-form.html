<div id="content-types-preview" class="page-layout simple fullwidth doc-page" layout="column">
    <!-- HEADER -->
    <div class="header md-accent-bg" layout="row" layout-align="space-between">
        <div layout="column" layout-align="space-between">
            <div>
                <span class="md-display-1 font-weight-300">
                    {{vm.entityGroup.name}} <md-resource-text name="Titles.PermissionSettings" />
                </span>
            </div>
        </div>
    </div>
    <!-- / HEADER -->
    <!-- CONTENT -->
    <div class="content" layout="column">
        <div layout="row">
            <div class="form-wrapper md-whiteframe-1dp" flex="100">
                <md-tabs>
                    <md-tab label="{{$root.globals.resources.Labels.Profiles}} that have access to {{ vm.entityGroup.name }}">
                        <md-entity-permissions display-property="Name"
                                                display-property-header="$root.globals.resources.Labels.ProfileType"
                                                type="mdBusinessLogic.dataAccess.entities.entitiesEnum.ProfileType"
                                                entities="vm.entityGroup.entities"
                                                save="vm.registerPermissionSaveEvents" />
                    </md-tab>
                    <md-tab label="{{$root.globals.resources.Labels.Users}} that have access to {{ vm.entityGroup.name }}">
                        <md-entity-permissions display-property="Username"
                                                display-property-header="$root.globals.resources.Labels.User"
                                                type="mdBusinessLogic.dataAccess.entities.entitiesEnum.User"
                                                entities="vm.entityGroup.entities"
                                                save="vm.registerPermissionSaveEvents" />
                    </md-tab>
                </md-tabs>
                <md-button class="md-raised md-accent" ng-click="vm.save()"><span md-resource-text name="Labels.Save"></span></md-button>
                <a class="md-button md-raised" ui-sref="app.settings_configuration_permissions"><span md-resource-text name="Labels.Back"></span></a>
            </div>
        </div>
    </div>
    <!-- / CONTENT -->
</div>

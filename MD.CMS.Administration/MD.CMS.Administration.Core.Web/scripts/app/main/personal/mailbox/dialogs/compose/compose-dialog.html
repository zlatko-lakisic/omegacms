<md-dialog class="compose-dialog" aria-label="New Message">
    <form autocomplete="off" class="md-inline-form" name="composeForm" novalidate>
        <md-toolbar class="md-accent md-hue-2">
            <div class="md-toolbar-tools" layout="row" layout-align="space-between center">
                <span class="title" md-resource-text name="Titles.NewMessage"></span>
                <md-button class="md-icon-button" ng-click="vm.closeDialog()" aria-label="Close dialog">
                    <md-icon md-font-icon="icon-close"></md-icon>
                </md-button>
            </div>
        </md-toolbar>

        <md-dialog-content ms-scroll>
            <md-cms-autocomplete md-type="$root.mdBusinessLogic.dataAccess.entities.entitiesEnum.User"
                                 md-input-name="toUser"
                                 md-floating-label="{{$root.globals.resources.Labels.To}}"
                                 md-selected-item="vm.toUser"
                                 placeholder="{{$root.globals.resources.Labels.To}}" />

            <md-input-container class="md-block">
                <label>Subject</label>
                <input ng-model="vm.message.Subject" type="text">
            </md-input-container>

            <md-cms-textarea md-input-name="replytext" md-floating-label="Reply" md-model="vm.text" />
        </md-dialog-content>

        <md-dialog-actions layout="row" layout-align="space-between center">
            <div layout="row" layout-align="start center">
                <md-button ng-click="vm.sendMessage()" class="send-button md-accent md-raised" aria-label="Send" ng-disabled="composeForm.$invalid">
                    <md-resource-text name="Labels.Send"></md-resource-text>
                </md-button>              
            </div>          
        </md-dialog-actions>
    </form>   
</md-dialog>

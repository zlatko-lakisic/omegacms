<div id="mail" class="page-layout carded left-sidenav" layout="row">
    <!-- TOP BACKGROUND -->
    <div class="top-bg md-accent-bg"></div>
    <!-- / TOP BACKGROUND -->
    <!-- SIDENAV -->
    <md-sidenav class="sidenav" md-is-locked-open="$mdMedia('gt-md')" md-component-id="main-sidenav"
                ng-include="'scripts/app/main/personal/mailbox/sidenavs/main-sidenav.html'" ms-scroll ms-sidenav-helper>
    </md-sidenav>
    <!-- / SIDENAV -->
    <!-- CENTER -->
    <div class="center" layout="column" flex>
        <!-- CONTENT HEADER -->
        <div class="header" layout="row" layout-align="start center">
            <div class="search-wrapper md-whiteframe-4dp"
                 layout="row"
                 layout-align="start center"
                 flex>
                <md-button class="md-icon-button sidenav-toggle" ng-click="vm.toggleSidenav('main-sidenav')" hide-gt-md>
                    <md-icon class="icon" md-font-icon="icon-menu"></md-icon>
                </md-button>
                <div class="search" flex layout="row" layout-align="start center">
                    <md-icon md-font-icon="icon-magnify" class="icon s24"></md-icon>
                    <input flex
                           type="text"
                           placeholder="{{$root.globals.resources.Labels.SearchEmailContact}}"
                           ng-keyup="$event.keyCode == 13 ? vm.search() : null"
                           ng-disabled="!vm.searchGotResponse"
                           ng-model="vm.searchTerm"
                           ng-model-options="{debounce:1000}"
                           ng-change="vm.search()">
                </div>
            </div>
        </div>
        <!-- / CONTENT HEADER -->
        <!-- CONTENT CARD -->
        <div class="content-card" layout="column" flex>
            <!-- MAIL READ PANE TOOLBAR -->
            <div class="toolbar" layout="row" layout-align="space-between center" ng-if="vm.activeMailPaneIndex === 1">
                <md-button class="md-icon-button"
                           ng-click="vm.closeReadPane()"
                           aria-label="Back">
                    <md-icon md-font-icon="icon-keyboard-backspace"></md-icon>
                </md-button>
            </div>
            <!-- / MAIL READ PANE TOOLBAR -->
            <!-- CONTENT TOOLBAR -->
            <div class="toolbar" layout="row" layout-align="space-between center" ng-if="vm.activeMailPaneIndex === 0">
                <div layout="row" layout-align="start center" flex>
                    <md-checkbox class="no-label" aria-label="{{vm.allChecked ? 'Uncheck All' : 'Check All'}}"
                                 ng-checked="vm.allChecked" ng-click="vm.checkAll()" md-indeterminate="vm.indetermined"></md-checkbox>
                    <div class="divider-vertical" hide show-gt-sm></div>                  
                    <md-button class="md-icon-button"
                               aria-label="Delete"
                               hide show-gt-sm ng-click="vm.deleteMessagesDialog($event);">
                        <md-icon md-font-icon="icon-delete"></md-icon>
                        <md-tooltip><span md-resource-text name="Labels.DeleteMessages"></span></md-tooltip>
                    </md-button>
                    <div class="divider-vertical" hide show-gt-sm></div>        
                    <md-menu>
                        <md-button class="md-icon-button" aria-label="Move to"
                                   ng-click="$mdOpenMenu($event)" ng-disabled="vm.allFolders.length <= 4">
                            <md-icon md-font-icon=" icon-folder">
                            </md-icon>
                            <md-tooltip><span md-resource-text name="Labels.MoveTo"></span></md-tooltip>
                        </md-button>
                        <md-menu-content width="3">
                            <md-menu-item ng-repeat="folder in vm.allFolders | filter: {IsGlobal: 'false'}">
                                <md-button aria-label="folder.Name" ng-disabled="folder == vm.selectedFolder" ng-click="vm.moveMessages(folder, vm.checked);">
                                    {{folder.Name}}
                                </md-button>
                            </md-menu-item>
                        </md-menu-content>
                    </md-menu>
                    <div class="divider-vertical" hide show-gt-sm></div>               
                    <md-button class="md-icon-button"
                               hide show-gt-sm
                               ng-show="vm.selectedFolder.IsGlobal == false"
                               ng-click="vm.editFolderDialog($event);">
                        <md-icon md-font-icon="icon-table-edit"></md-icon>
                        <md-tooltip><span md-resource-text name="Labels.EditFolder"></span></md-tooltip>
                    </md-button>
                </div>
                <md-pager page="vm.currentPage" total="vm.totalItems" no-tabs="true" no-size="true" on-pager-change="vm.updatePager(currentPage, pageSize, pagesBorder)"></md-pager>
            </div>
            <!-- / CONTENT TOOLBAR -->
            <!-- CONTENT WRAPPER -->
            <div class="content-wrapper" layout="row" flex>
                <div ng-if="!vm.dynamicHeight && vm.messages.length > 0" layout="row" flex="100">
                    <div flex="50" class="list-view" ms-scroll>
                        <!-- MAIL LIST PANE -->
                        <md-cms-placeholder md-template="l" md-loading="vm.listLoading" flex="100" />
                        <div ng-if="!vm.listLoading" class="mail-list-pane"
                             ng-include="'scripts/app/main/personal/mailbox/views/list/list-view.html'">
                        </div>
                        <!-- / MAIL LIST PANE -->
                    </div>
                    <div flex="50">
                        <md-cms-placeholder md-template="xl" md-loading="vm.messageLoading" flex="100" />
                        <!-- MAIL READ PANE -->
                        <div ng-if="!vm.messageLoading">
                            <div class="content mail-read-pane" ng-if="(vm.selectedFolder.Id != 4 && vm.selectedMessage) || vm.selectedMessage.NotContentApproval"
                                 ng-include="'scripts/app/main/personal/mailbox/views/read/read-view.html'" ms-scroll>
                            </div>
                            <div class="content mail-read-pane" ng-if="vm.selectedFolder.Id == 4 && vm.selectedMessage && !vm.selectedMessage.NotContentApproval"
                                 ng-include="'scripts/app/main/personal/mailbox/views/read/approval-template/approval-template.html'" ms-scroll>
                            </div>
                        </div>
                        <!-- / MAIL READ PANE -->
                    </div>
                </div>
                <md-tabs ng-if="vm.dynamicHeight && vm.messages.length > 0"
                         class="mail-tabs"
                         md-dynamic-height="{{vm.dynamicHeight}}"
                         flex
                         ng-hide="vm.messages.length < 1"
                         md-selected="vm.activeMailPaneIndex"
                         md-enable-disconnect="false">
                    <md-tab>
                        <md-tab-label><md-resource-text name="Labels.Messages"></md-resource-text></md-tab-label>
                        <md-tab-body>
                            <!-- MAIL LIST PANE -->
                            <div class="content mail-list-pane"
                                 ng-include="'scripts/app/main/personal/mailbox/views/list/list-view.html'" ms-scroll>
                            </div>
                            <!-- / MAIL LIST PANE -->
                        </md-tab-body>
                    </md-tab>
                    <md-tab ng-show="vm.selectedMessage">
                        <md-tab-label><md-resource-text name="Labels.ReadPane"></md-resource-text></md-tab-label>
                        <md-tab-body>
                            <!-- MAIL READ PANE -->
                            <div class="content mail-read-pane" ng-if="(vm.selectedFolder.Id != 4 && vm.selectedMessage) || vm.selectedMessage.NotContentApproval"
                                 ng-include="'scripts/app/main/personal/mailbox/views/read/read-view.html'" ms-scroll>
                            </div>
                            <div class="content mail-read-pane" ng-if="vm.selectedFolder.Id == 4 && vm.selectedMessage && !vm.selectedMessage.NotContentApproval"
                                 ng-include="'scripts/app/main/personal/mailbox/views/read/approval-template/approval-template.html'" ms-scroll>
                            </div>
                            <!-- / MAIL READ PANE -->
                        </md-tab-body>
                    </md-tab>
                </md-tabs>
                <!-- / CONTENT WRAPPER -->
                <md-card ng-show="vm.messages.length < 1" class="md-default-theme no-msg" aria-hidden="false">
                    <md-card-title>
                        <md-card-title-text>
                            <span class="align-vertical-middle" md-resource-text name="Labels.NoMessages"></span>
                        </md-card-title-text>
                    </md-card-title>
                </md-card>
            </div>
           
            <!-- / CONTENT CARD -->
        </div>
        <!-- / CENTER -->
    </div>
</div>

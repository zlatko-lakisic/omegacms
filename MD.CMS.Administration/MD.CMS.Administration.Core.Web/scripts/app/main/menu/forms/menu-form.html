<div id="forms" class="page-layout simple fullwidth doc-page" layout="column">
    <!-- HEADER -->
    <div class="header md-accent-bg" layout="row" layout-align="space-between">
        <div layout="column" layout-align="space-between">
            <div>
                <span class="md-display-1 font-weight-300" md-resource-text name="Titles.MenuEditor">Menu editor</span>
            </div>
            <!-- BREADCRUMB -->
            <div class="breadcrumb text-truncate" layout="row" layout-align="start center">
                <span data-ng-repeat="path in vm.menu.ParentArray" ui-sref="app.menu_list({menuPath:path.MenuPath,currentView:vm.currentView})">
                    {{path.Name}}
                    <md-icon md-font-icon="icon-chevron-right" class="icon separator"></md-icon>
                </span>
            </div>
            <!-- / BREADCRUMB -->
        </div>
    </div>
    <!-- / HEADER -->
    <!-- CONTENT -->
    <div class="content" layout="column">
        <!-- BASIC FORM -->
        <div class="form-wrapper md-whiteframe-1dp" flex="60">
            <div class="form-title">{{vm.formTitle | uppercase}}</div>
            <form autocomplete="off" name="basicForm" class="md-inline-form" novalidate>
                <md-tabs md-dynamic-height>
                    <md-tab label="{{$root.globals.resources.Titles.Menu}}" ng-click="vm.changeTab(1)">
                        <div layout="column" layout-gt-sm="row">
                            <md-input-container flex>
                                <label md-resource-text name="Labels.Name"></label>
                                <input type="text" name="name" ng-model="vm.menu.Name" required>
                                <div ng-messages="basicForm.firstname.$error"
                                     role="alert">
                                    <div ng-message="required">
                                        <span md-resource-text name="Labels.Required"></span>
                                    </div>
                                </div>
                            </md-input-container>
                        </div>
                        <md-input-container class="md-block">
                            <label md-resource-text name="Labels.Description"></label>
                            <textarea ng-model="vm.menu.Description" columns="1" md-maxlength="150" rows="5"></textarea>
                        </md-input-container>
                    </md-tab>
                    <md-tab label="{{$root.globals.resources.Labels.Contents}}" ng-click="vm.changeTab(2)">
                        <div>
                            <md-card>
                                <md-card-content>
                                    <md-chips class="custom-chips"
                                              ng-model="vm.content"
                                              md-on-add="vm.addContent($chip)"
                                              md-on-remove="vm.RemoveContent($chip)"
                                              md-require-match="true">
                                        <md-autocomplete md-selected-item="selectedcontentItem"
                                                         md-search-text="contentSearchText"
                                                         md-items="content in vm.queryAllContent(contentSearchText)"
                                                         md-item-text="content.Title"
                                                         placeholder="{{$root.globals.resources.Labels.SearchPlaceholder}}">

                                            <span md-highlight-text="contentSearchText">{{content.Title}}</span>
                                        </md-autocomplete>
                                        <md-chip-template>
                                            <span>
                                                <strong>{{$chip.Title}}</strong>
                                            </span>
                                        </md-chip-template>
                                        <button ng-disabled="false" md-chip-remove class="md-primary">
                                            <md-icon style="margin: 4px" class="s24" md-font-icon="icon-close"></md-icon>
                                        </button>
                                    </md-chips>
                                </md-card-content>
                            </md-card>
                        </div>
                    </md-tab>
                    <md-tab label="{{$root.globals.resources.Labels.Options}}" ng-click="vm.changeTab(3)">
                        <div>{{vm.menu.Options}}</div>
                    </md-tab>
                </md-tabs>
                <md-button type="submit" class="md-raised md-accent" aria-label="Submit"
                           ng-disabled="basicForm.$invalid"
                           ng-click="vm.sendForm($event);">
                    <md-resource-text name="Labels.Submit"></md-resource-text>
                </md-button>
                <md-button class="md-accent md-raised"
                        type="button"
                        aria-label="Back to previous page"
                        ng-click="vm.changeState()">
                    <span class="ng-scope"> Back </span><div class="md-ripple-container"></div>
                </md-button>
            </form>
        </div>
        <!-- / BASIC FORM -->
    </div>
</div>

<!-- / CONTENT -->

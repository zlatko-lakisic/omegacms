<div class="diagram-wrapper" layout="row" flex>
    <div id="diagram-canvas" ng-hide="!vm.diagramLoaded" layout="row" flex></div>
    <div ng-if="!vm.diagramLoaded" layout="row" layout-align="center center" flex>
        <md-progress-circular md-diameter="96" class="md-accent"></md-progress-circular>
    </div>
    <div id="diagram-canvas-ng" ng-transclude="canvas" ng-hide="true"></div>
    <div id="diagram-toolbar" ng-transclude="toolbar" />
</div>

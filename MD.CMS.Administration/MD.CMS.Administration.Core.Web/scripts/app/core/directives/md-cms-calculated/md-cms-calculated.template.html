<div class="md-block form-container md-cms-file" flex layout="row">
    <md-input-container flex>
        <label>{{mdFloatingLabel}}</label>
        <input type="text" ng-model="mdModel.value" readonly flex />
        <div ng-if="hasParseError" role="alert">
            There was an error parsing this calculated field value
        </div>
    </md-input-container>
    {{getInnerHtml()}}
</div>

<div flex layout="row" layout-align="start center">
    <label for="ms-search-bar-input">
        <md-icon id="ms-search-bar-expander" md-font-icon="icon-magnify" class="icon s24" ng-click="vm.showSearchButton()"></md-icon>
        <md-icon id="ms-search-bar-collapser" md-font-icon="icon-close" class="icon s24" ng-click="vm.hideSearchButton()"></md-icon>
    </label>
    <input id="ms-search-bar-input" type="text" ng-model="vm.searchTerm" placeholder="Search"
           translate-attr-placeholder="TOOLBAR.SEARCH" flex>
    <md-button id="search-cms-button" ng-show="vm.showButton" ng-click="vm.searchCms(vm.searchTerm);">Search</md-button>
</div>

<mat-sidenav-container class="flex h-full w-full min-h-0 flex-col" [hasBackdrop]="false">
  <mat-sidenav
    #drawer
    mode="side"
    opened
    class="w-72 max-w-80 border-e border-neutral-200 scheme-dark:border-neutral-800"
  >
    <div
      class="border-b border-neutral-200 px-4 py-3 text-sm font-bold uppercase tracking-wider scheme-dark:border-neutral-800"
      role="heading"
    >
      Omega <span class="text-md font-medium normal-case tracking-normal opacity-80">CMS</span>
    </div>
    <div class="max-h-[calc(100dvh-3.5rem)] overflow-y-auto">
      <app-fuse-sidenav />
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="flex min-h-0 min-w-0 flex-1 flex-col">
    <mat-toolbar color="primary" class="!border-b border-neutral-200 scheme-dark:border-neutral-800">
      <span class="flex-1" aria-hidden="true"></span>
      <button matIconButton type="button" aria-label="Language">
        <mat-icon>flag</mat-icon>
      </button>
      <button matIconButton type="button" aria-label="Account">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>
    <main class="flex min-h-0 flex-1 flex-col overflow-auto p-4">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

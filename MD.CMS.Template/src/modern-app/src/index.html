<!doctype html>
<html id="fuse" lang="en">
  <head>
    <base href="/" />
    <title>Omega CMS (modern)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <link rel="preload" href="fonts/geist/Geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist/Geist-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist/GeistMono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist/GeistMono-Italic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <script>
      !function () {
        try {
          const e = document.documentElement.classList;
          e.remove("scheme-dark", "scheme-light");
          const c = localStorage.getItem("scheme");
          const t = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const s =
            "dark" === c || ("system" === c && t) ? "scheme-dark" : "scheme-light";
          e.add(s);
        } catch (e) {}
      }();
    </script>
    <app-root></app-root>
  </body>
</html>
